# Generated by soc-ai soup-report-config.
# Train only on redacted, QA-approved SOC report examples.
base: "Qwen/Qwen2.5-Coder-3B-Instruct"
task: sft

data:
  train: "data/report_references/official_report_style_redacted_chunks.jsonl"
  format: alpaca
  val_split: 0.1
  max_length: 4096

training:
  epochs: 1
  lr: 1e-5
  batch_size: 1
  stream_layers: true
  lora:
    r: 16
    alpha: 16
    target_modules: auto
  quantization: 4bit
  gradient_checkpointing: true

output: "models/soc-report-style-qwen25"
